<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">◢</div><div><strong>Aglib</strong><small>Liberia Traceability Platform</small></div></div><nav class="nav" id="nav">
<button class="active" data-page="dashboard"><span>▦</span><b class="navlabel">Dashboard</b></button><button data-page="mapping"><span>⌘</span><b class="navlabel">Supply Chain Mapping</b></button><button data-page="suppliers"><span>♙</span><b class="navlabel">Supplier Management</b></button><button data-page="traceability"><span>⌕</span><b class="navlabel">Product Traceability</b></button><button data-page="flow"><span>⇄</span><b class="navlabel">Material Flow</b></button><button data-page="integration"><span>▤</span><b class="navlabel">Integration</b></button></nav><div class="side-bottom"><div class="cocoa">♧</div><b>Traceable Cocoa</b><br>Stronger Communities<br>A More Resilient Liberia</div></aside>
<main class="main"><header class="topbar"><select class="selectpill" id="commodity"><option>Cocoa</option></select><select class="selectpill" id="period"><option>Jan 2024 – Dec 2024</option><option>Jan 2025 – Dec 2025</option><option>All periods</option></select><button class="userpill" id="adminBtn"><span class="avatar">AD</span><span>Admin⌄</span></button></header><div class="content" id="content"></div></main></div>
<div class="toast" id="toast"></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<script>
const data={suppliers:[
{id:'AG-LF-01',name:'Lofa Cocoa Aggregators',tier:1,type:'Aggregator',county:'Lofa',partners:2,status:'Mapped'},
{id:'AG-NI-02',name:'Nimba Agricultural Group',tier:1,type:'Aggregator',county:'Nimba',partners:2,status:'Mapped'},

{id:'AG-GG-04',name:'Gedeh Cocoa Union',tier:1,type:'Aggregator',county:'Grand Gedeh',partners:1,status:'Mapped'},
{id:'TR-LF-01',name:'Lofa Trading Co.',tier:2,type:'Trader',county:'Lofa',partners:3,status:'Mapped'},
{id:'TR-NI-02',name:'Nimba Export Ltd',tier:2,type:'Trader',county:'Nimba',partners:3,status:'Mapped'},
{id:'TR-BO-03',name:'Bong Trading',tier:2,type:'Trader',county:'Bong',partners:3,status:'Review'},
{id:'TR-GG-04',name:'Gedeh Commodities',tier:2,type:'Trader',county:'Grand Gedeh',partners:3,status:'Mapped'},
{id:'CO-LF-01',name:'Lofa Farmers Coop',tier:3,type:'Cooperative',county:'Lofa',partners:5,status:'Mapped'},
{id:'CO-NI-02',name:'Nimba Farmers Coop',tier:3,type:'Cooperative',county:'Nimba',partners:4,status:'Mapped'},
{id:'CO-BO-03',name:'Bong Farmers Coop',tier:3,type:'Cooperative',county:'Bong',partners:5,status:'Review'},
{id:'CO-GG-04',name:'Gedeh Farmers Coop',tier:3,type:'Cooperative',county:'Grand Gedeh',partners:4,status:'Mapped'}],

docs:[{name:'Lofa Aggregator Quality Certificate',supplier:'Lofa Cocoa Aggregators',type:'Quality Certificate',date:'2024-09-18',status:'Valid'},{name:'Nimba Group Audit Report',supplier:'Nimba Agricultural Group',type:'Audit Report',date:'2024-11-03',status:'Valid'},{name:'Bong Trading Compliance File',supplier:'Bong Trading',type:'Compliance',date:'2024-07-12',status:'Expiring Soon'},{name:'Gedeh Coop Assessment',supplier:'Gedeh Farmers Coop',type:'Assessment Certificate',date:'2024-06-21',status:'Missing'}],
batches:[{id:'COC-24-001',product:'Cocoa beans',county:'Lofa',quantity:'12,400 kg',stage:'Outbound',status:'In transit'},{id:'COC-24-002',product:'Cocoa beans',county:'Nimba',quantity:'8,200 kg',stage:'Work in progress',status:'In progress'},{id:'COC-24-003',product:'Cocoa beans',county:'Bong',quantity:'6,750 kg',stage:'Inbound',status:'Received'},{id:'COC-24-004',product:'Cocoa beans',county:'Grand Gedeh',quantity:'9,100 kg',stage:'Work in progress',status:'In progress'}]};
let current='dashboard',searchTerm='',tierFilter='All tiers';const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}
function status(s){let c=s==='Missing'||s==='Blocked'?'bad':s==='Expiring Soon'||s==='Review'?'warn':'';return `<span class="status ${c}">${esc(s)}</span>`}
function header(title,sub,action=''){return `<div class="page-title"><div><div class="eyebrow">Aglib / Liberia / Cocoa</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function kpi(icon,label,value,trend,kind=''){return `<div class="card kpi"><div class="ico ${kind}">${icon}</div><div><div class="label">${label}</div><div class="value">${value}</div><div class="trend">${trend}</div></div></div>`}
function donut(title,total,caption,parts,colors){let sum=parts.reduce((a,b)=>a+b[1],0),cur=0,stops=parts.map((p,i)=>{let a=cur/sum*100;cur+=p[1];return `${colors[i]} ${a}% ${cur/sum*100}%`}).join(',');return `<div class="card"><div class="mini-title">${title}</div><div class="donutrow"><div class="donut" style="background:conic-gradient(${stops})"><span>${total}<small>${caption}</small></span></div><div class="legend">${parts.map((p,i)=>`<div><i class="dot" style="background:${colors[i]}"></i>${p[0]}<b>${p[1]}</b></div>`).join('')}</div></div></div>`}
function countyChart(){return `<div class="card"><div class="mini-title">Supplier Distribution by County</div><div class="county-chart">${[{n:'Lofa',v:14,h:72},{n:'Nimba',v:12,h:61},{n:'Bong',v:10,h:50},{n:'Grand Gedeh',v:12,h:61}].map(c=>`<div class="county"><strong>${c.v}</strong><i style="height:${c.h}%"></i><small>${c.n}</small></div>`).join('')}</div></div>`}
function tierCard(n,name,count,unit,pct,color){return `<div class="tier" data-tier="${n}" onclick="openTier(${n})"><div class="tiername">Tier ${n}<br>${name}</div><div class="count">${count}</div><div class="sub">${unit}</div><div class="progress"><i style="width:${pct}%;background:${color}"></i></div></div>`}
function mappingMini(){let groups=[{t:1,name:'Aggregators',list:[['Lofa Cocoa Aggregators (2)','Lofa'],['Nimba Agricultural Group (2)','Nimba'],['Bong Agro Partners (1)','Bong'],['Gedeh Cocoa Union (1)','Grand Gedeh']]},{t:2,name:'Traders',list:[['Lofa Trading Co. (3)','Lofa'],['Nimba Export Ltd (3)','Nimba'],['Bong Trading (3)','Bong'],['Gedeh Commodities (3)','Grand Gedeh']]},{t:3,name:'Cooperatives',list:[['Lofa Farmers Coop (5)','Lofa'],['Nimba Farmers Coop (4)','Nimba'],['Bong Farmers Coop (5)','Bong'],['Gedeh Farmers Coop (4)','Grand Gedeh']]},{t:4,name:'Farm Plots',list:data.plots.map(p=>[`${p.name} (${p.count})`,p.count])}];return `<div class="tiermap">${groups.map(g=>`<div class="tiercol"><div class="tiercolhead">Tier ${g.t} — ${g.name}<small>${[6,12,18,312][g.t-1]} records</small></div>${g.list.map(item=>`<div class="entity" onclick="${g.t===4?`showCounty('${item[0].split(' ')[0]}')`:`showSupplier('${item[0].replace(/ \(.*\)/,'')}')`}">${esc(item[0])}<small>${g.t===4?'Tier 4 farm plots':esc(item[1])}</small></div>`).join('')}</div>`).join('')}</div>`}
function mapMock(){return `<div class="mapbox"><svg viewBox="0 0 340 270" aria-label="Schematic county location map"><path d="M55 20 L120 15 155 33 192 28 220 54 267 64 288 98 270 127 284 156 251 182 232 214 195 239 154 224 132 203 103 190 86 159 58 148 43 113 27 88Z" fill="#dce9d5" stroke="#b8cdb5" stroke-width="1.5"/><path d="M55 20 L86 159 132 203 M120 15 L154 224 M192 28 L195 239 M43 113 L270 127 M58 148 L251 182 M103 190 L232 214" fill="none" stroke="#c1d5bc" stroke-width="1.2"/><path d="M27 88 L43 113 L58 148" fill="none" stroke="#a6c9dd" stroke-width="4"/><g fill="#16724c"><circle cx="104" cy="65" r="5"/><circle cx="120" cy="82" r="4"/><circle cx="133" cy="94" r="5"/><circle cx="144" cy="117" r="4"/></g><g fill="#67ad66"><circle cx="209" cy="107" r="5"/><circle cx="226" cy="121" r="4"/><circle cx="205" cy="138" r="5"/><circle cx="241" cy="143" r="4"/></g><g fill="#d9aa35"><circle cx="119" cy="150" r="5"/><circle cx="139" cy="164" r="4"/><circle cx="158" cy="152" r="5"/><circle cx="170" cy="177" r="4"/></g><g fill="#a65a30"><circle cx="218" cy="197" r="5"/><circle cx="237" cy="207" r="4"/><circle cx="205" cy="218" r="5"/><circle cx="247" cy="224" r="4"/></g><text x="95" y="52" fill="#215b40" font-size="12" font-weight="700">Lofa</text><text x="213" y="94" fill="#215b40" font-size="12" font-weight="700">Nimba</text><text x="113" y="140" fill="#8c671b" font-size="12" font-weight="700">Bong</text><text x="199" y="188" fill="#8c4a2a" font-size="10" font-weight="700">Grand Gedeh</text><text x="133" y="250" fill="#71877a" font-size="11" letter-spacing="2">LIBERIA</text></svg><div class="maplegend"><b>County</b><span>🟢 Lofa</span><span>🟩 Nimba</span><span>🟡 Bong</span><span>🟤 Grand Gedeh</span></div><div class="mapnote">Schematic demo locations · not GPS boundaries</div></div>`}
function dashboard(){return `${header('Welcome to Aglib','End-to-end visibility for a sustainable cocoa supply chain in Liberia','<div class="hero-note">Traceable Cocoa<br>for a Thriving Liberia<small>Illustrative demo dataset</small></div>')}<div class="grid kpis">${kpi('♙','Mapped Suppliers','48','▲ +12 this period')}${kpi('♧','Farm Plots Mapped','312','▲ +68 this period')}${kpi('▤','Documentation Coverage','78%','Required evidence recorded','blue')}${kpi('↗','Open Traceability Gaps','7','▼ -6 this period','rust')}</div><div class="grid two-col"><section class="card"><div class="section-head"><h2>◉ &nbsp;Supply Chain Coverage</h2><button onclick="go('mapping')">View Details →</button></div><div class="tiergrid">${tierCard(1,'Aggregators',6,'Suppliers',78,'#176b4c')}${tierCard(2,'Traders',12,'Suppliers',60,'#57a56d')}${tierCard(3,'Cooperatives',18,'Suppliers',70,'#d8a83f')}${tierCard(4,'Farm Plots',312,'Plots',100,'#a5522d')}</div></section><section class="card"><div class="section-head"><h2>♧ &nbsp;Key Metrics</h2></div><div class="metricgrid"><div class="metric"><div class="ico">⬡</div><div><div class="label">Cocoa Batches</div><strong>24</strong></div></div><div class="metric"><div class="ico">⇄</div><div><div class="label">Active Material Flows</div><strong>8</strong></div></div><div class="metric"><div class="ico">⌖</div><div><div class="label">Records with Provenance</div><strong>86%</strong></div></div><div class="metric"><div class="ico">♧</div><div><div class="label">Impact Data Coverage</div><strong>62%</strong></div></div></div></section></div><div class="grid ops"><div>${donut('Material Flow Status','24','Batches',[['Inbound',8],['In Progress',10],['Outbound',6]],['#188052','#e6b82f','#f0782a'])}</div><div>${donut('Document Status','186','Documents',[['Valid',145],['Expiring Soon',26],['Missing',15]],['#59ad6b','#e5b72f','#d93d2f'])}</div><div class="card"><div class="mini-title">Compliance & Impact</div><div class="barlist">${[['Environmental Data',62],['Social / Ethical Data',58],['Regulatory Inputs',71]].map(x=>`<div class="barrow"><div class="barlabel"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="progress"><i style="width:${x[1]}%;background:${x[0].startsWith('Social')?'#e7b82c':x[0].startsWith('Reg')?'#176b4c':'#58ae6a'}"></i></div></div>`).join('')}</div></div>${countyChart()}</div><div class="grid mapping-layout"><section class="card mapping-card"><div class="section-head"><h2>♧ &nbsp;Supply Chain Mapping</h2><button onclick="go('mapping')">View Full Map →</button></div>${mappingMini()}</section><section class="card"><div class="section-head"><h2>Farm Plot Locations</h2><button onclick="go('mapping')">Explore →</button></div>${mapMock()}</section></div><p style="color:var(--muted);font-size:11px;margin:14px 2px">Demo figures are illustrative and not verified operational data. County map is schematic, not a geographic boundary or GPS map.</p>`}
function supplierPage(){let list=data.suppliers.filter(s=>(s.name+' '+s.county+' '+s.type+' '+s.id).toLowerCase().includes(searchTerm.toLowerCase())&&(tierFilter==='All tiers'||String(s.tier)===tierFilter));return `${header('Supplier Management','Supplier directory and partner relationships across the four-tier cocoa chain.', '<button class="btn" onclick="openSupplierModal()">＋ Add Supplier</button>')}<div class="grid detailgrid" style="margin-bottom:14px">${[['Suppliers mapped','48'],['Tier 1 aggregators','6'],['Tier 2 traders','12']].map(x=>`<div class="detailbox"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><div class="toolbar"><input id="search" placeholder="Search supplier, county or ID…" value="${esc(searchTerm)}"><select id="tierfilter"><option>All tiers</option>${[1,2,3].map(t=>`<option ${tierFilter===String(t)?'selected':''} value="${t}">Tier ${t}</option>`).join('')}</select></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Supplier ID</th><th>Supplier name</th><th>Tier</th><th>Type</th><th>County</th><th>Downstream links</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr onclick="showSupplier('${s.name}')" style="cursor:pointer"><td>${s.id}</td><td><b>${s.name}</b></td><td>Tier ${s.tier}</td><td>${s.type}</td><td>${s.county}</td><td>${s.partners}</td><td>${status(s.status)}</td></tr>`).join('')}</tbody></table>${list.length?'':`<div class="empty">No suppliers match this filter.</div>`}</div></div>`}
function mappingPage(){return `${header('Supply Chain Mapping','Explore supplier relationships from Tier 1 aggregators to Tier 4 cocoa farm plots.','<button class="btn" onclick="openSupplierModal()">＋ Add Supplier</button>')}<div class="grid detailgrid" style="margin-bottom:14px">${[['Tier 1 · Aggregators','6'],['Tier 2 · Traders','12'],['Tier 3 · Cooperatives','18'] ,['Tier 4 · Farm plots','312']].map(x=>`<div class="detailbox"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><div class="section-head"><h2>Four-tier supplier network</h2><button onclick="toast('Showing all four tiers')">All tiers visible</button></div>${mappingMini()}</div><div class="grid mapping-layout" style="margin-top:14px"><div class="card"><div class="section-head"><h2>County coverage</h2></div>${mapMock()}</div><div class="card"><div class="section-head"><h2>Mapping notes</h2></div><p style="color:var(--muted)">The demo shows a sample network linking aggregators, traders, cooperatives and farm-plot groups across the four specified counties.</p><div class="barlist">${data.plots.map(p=>`<div class="barrow"><div class="barlabel"><span>${p.county}</span><b>${p.count} plots</b></div><div class="progress"><i style="width:${p.count/84*100}%"></i></div></div>`).join('')}</div><p style="color:var(--muted);font-size:11px">Relationships and counts are illustrative. Confirm supplier links before treating them as actual.</p></div></div>`}
function tracePage(){return `${header('Product-Backward Traceability','Follow cocoa batches from shipment evidence back to recorded source suppliers and farm plots.')}<div class="card"><div class="toolbar"><input id="batchsearch" placeholder="Search batch ID or county…"><button class="btn" onclick="traceSearch()">Trace batch</button></div><div id="traceResult"><div class="empty">Select a cocoa batch below to view its backward trace and evidence gaps.</div></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Batch ID</th><th>Product</th><th>Origin county</th><th>Quantity</th><th>Current stage</th><th>Status</th><th></th></tr></thead><tbody>${data.batches.map(b=>`<tr><td><b>${b.id}</b></td><td>${b.product}</td><td>${b.county}</td><td>${b.quantity}</td><td>${b.stage}</td><td>${status(b.status==='In transit'?'Review':b.status)}</td><td><button class="linkbtn" onclick="showTrace('${b.id}')">Trace →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function flowPage(){return `${header('Material Flow','Illustrative cocoa movement records across inbound, work-in-progress and outbound stages.','<button class="btn" onclick="openFlowModal()">＋ Record Movement</button>')}<div class="grid detailgrid" style="margin-bottom:14px">${[['Inbound','8'],['Work in progress','10'],['Outbound','6']].map(x=>`<div class="detailbox"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="card"><div class="section-head"><h2>Recent material-flow records</h2><span class="status warn">Demo data</span></div><div class="tablewrap"><table class="data-table"><thead><tr><th>Batch ID</th><th>Commodity</th><th>County</th><th>Quantity</th><th>Stage</th><th>Event status</th></tr></thead><tbody>${data.batches.map(b=>`<tr><td>${b.id}</td><td>Cocoa</td><td>${b.county}</td><td>${b.quantity}</td><td>${b.stage}</td><td>${status(b.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function integrationPage(){return `${header('Integration Layer','Integration points for PLM/ERP systems and external data sources named in the concept.')}<div class="grid detailgrid">${[['PLM','Product and material references','Not connected'],['ERP','Supplier, facility and movement references','Not connected'],['External environmental data','Carbon footprint and biodiversity indicators','Sample data'],['Regulatory inputs','Regulatory references and status','Sample data']].map((x,i)=>`<div class="card"><div class="ico">${['▦','▤','♧','✓'][i]}</div><h3>${x[0]}</h3><p style="color:var(--muted);font-size:12px;min-height:35px">${x[1]}</p>${status(x[2])}<div style="margin-top:14px"><button class="btn secondary" onclick="integrationDetail('${x[0]}')">View details</button></div></div>`).join('')}</div><p style="color:var(--muted);font-size:12px;margin-top:15px">These are demonstration states only. No external systems or data providers are connected in this prototype.</p>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));let html={dashboard,mapping:mappingPage,suppliers:supplierPage,traceability:tracePage,flow:flowPage,integration:integrationPage}[current]();$('#content').innerHTML=html;const s=$('#search');if(s)s.addEventListener('input',e=>{searchTerm=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});const tf=$('#tierfilter');if(tf)tf.addEventListener('change',e=>{tierFilter=e.target.value;render()});}
function go(page){current=page;searchTerm='';render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function openModal(html){$('#modal').innerHTML=html;$('#modalback').classList.add('show')}function closeModal(){$('#modalback').classList.remove('show')}$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
function openSupplierModal(){openModal(`<h2>Add supplier record</h2><p>Demo-only form. New records are held in this browser session.</p><form id="supplierform"><label>Supplier name</label><input name="name" required placeholder="e.g. Cocoa Aggregator Co."><label>Tier</label><select name="tier"><option value="1">Tier 1 — Aggregator</option><option value="2">Tier 2 — Trader</option><option value="3">Tier 3 — Cooperative</option></select><label>County</label><select name="county"><option>Lofa</option><option>Nimba</option><option>Bong</option><option>Grand Gedeh</option></select><label>Supplier type</label><input name="type" required placeholder="Aggregator, trader, cooperative…"><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save record</button></div></form>`);$('#supplierform').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name');data.suppliers.push({id:'DEMO-'+String(data.suppliers.length+1).padStart(3,'0'),name,tier:+f.get('tier'),type:f.get('type'),county:f.get('county'),partners:0,status:'Mapped'});closeModal();go('suppliers');toast('Supplier added to this demo session')})}
function openFlowModal(){openModal(`<h2>Record material movement</h2><p>Demo-only movement entry.</p><form id="flowform"><label>Batch ID</label><input name="id" required placeholder="COC-24-005"><label>Origin county</label><select name="county"><option>Lofa</option><option>Nimba</option><option>Bong</option><option>Grand Gedeh</option></select><label>Quantity</label><input name="quantity" required placeholder="e.g. 5,000 kg"><label>Stage</label><select name="stage"><option>Inbound</option><option>Work in progress</option><option>Outbound</option></select><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn">Save movement</button></div></form>`);$('#flowform').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data.batches.push({id:f.get('id'),product:'Cocoa beans',county:f.get('county'),quantity:f.get('quantity'),stage:f.get('stage'),status:'Recorded'});closeModal();go('flow');toast('Movement added to this demo session')})}
function showSupplier(name){let s=data.suppliers.find(x=>x.name===name)||data.suppliers.find(x=>name.includes(x.name));if(!s){toast('Demo relationship record');return}openModal(`<h2>${esc(s.name)}</h2><p>${esc(s.type)} · Tier ${s.tier} · ${esc(s.county)}</p><div class="grid detailgrid"><div class="detailbox"><small>Supplier ID</small><strong style="font-size:15px">${s.id}</strong></div><div class="detailbox"><small>Downstream links</small><strong>${s.partners}</strong></div><div class="detailbox"><small>Mapping status</small><strong style="font-size:15px">${s.status}</strong></div></div><p>Supplier relationships and records shown here are illustrative demo data.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function openTier(t){if(t===4){go('mapping');toast('Tier 4 farm plots selected')}else{go('suppliers');tierFilter=String(t);render();toast('Filtered to Tier '+t)}}function showCounty(c){toast('Showing schematic plot group: '+c)}
function showTrace(id){let b=data.batches.find(x=>x.id===id);$('#traceResult').innerHTML=`<div style="padding:16px 0"><div class="section-head"><h2>Backward trace · ${b.id}</h2>${status('Demo trace')}</div><div class="grid detailgrid"><div class="detailbox"><small>Product / batch</small><strong style="font-size:15px">${b.product}</strong></div><div class="detailbox"><small>Recorded origin</small><strong style="font-size:15px">${b.county}</strong></div><div class="detailbox"><small>Quantity</small><strong style="font-size:15px">${b.quantity}</strong></div></div><div class="grid two-col" style="margin-top:12px"><div class="card"><b>Trace path</b><p style="color:var(--muted)">Shipment / batch → material record → supplier → cooperative → farm-plot group</p><p>Origin county: <b>${b.county}</b></p><span class="status warn">Plot-level links require confirmation</span></div><div class="card"><b>Evidence review</b><p style="color:var(--muted)">BOM, chain-of-custody and shipping evidence should be attached to verify this trace.</p><span class="status bad">Evidence not fully verified</span></div></div></div>`}function traceSearch(){let q=($('#batchsearch')?.value||'').toLowerCase(),b=data.batches.find(x=>(x.id+' '+x.county).toLowerCase().includes(q));if(b)showTrace(b.id);else toast('No matching batch found')}
function integrationDetail(name){openModal(`<h2>${name} integration</h2><p>This prototype includes the integration point in the architecture, but no live external connection is configured.</p><div class="detailbox"><small>Connection state</small><strong style="font-size:15px">Not connected</strong></div><p style="font-size:12px;color:var(--muted)">Demo behaviour: use sample records and source references. Live connection requires a confirmed endpoint, credentials and integration configuration.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}$('#adminBtn').addEventListener('click',()=>toast('Admin demo view · authentication not enabled'));$('#period').addEventListener('change',e=>toast('Selected period: '+e.target.value+' · figures remain illustrative'));render();
</script></body></html>
